# yaml-language-server: $schema=./cv.schema.json
#
# Single source of truth for the CV. Edit this file, then build:
#   Windows:      powershell -ExecutionPolicy Bypass -File scripts\build.ps1
#   macOS/Linux:  sh scripts/build.sh
# It renders both the PDF (via LaTeX) and the web page.
#
# Text formatting: **bold**. The word LaTeX renders as the LaTeX logo in the PDF.
# Hide a whole section or entry with `hidden: true`; hide a single bullet by commenting it out.
# Phone number is NOT stored here: set CV_PHONE in a local .env file (see .env.example).

